<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perch — Welcome</title>
<link rel="stylesheet" href="lib/colors_and_type.css">
<style>
  html, body { margin: 0; height: 100%; background: #0f0e12; overflow: hidden; }
  * { -webkit-font-smoothing: antialiased; }
  #root { position: fixed; inset: 0; }
  button { font-family: var(--font-sans); }
  a { -webkit-font-smoothing: antialiased; }
  .col-scroll::-webkit-scrollbar { width: 9px; height: 9px; }
  .col-scroll::-webkit-scrollbar-thumb { background: var(--gray-400); border-radius: 9999px; border: 2px solid transparent; background-clip: content-box; }
  .col-scroll::-webkit-scrollbar-thumb:hover { background: var(--gray-500); background-clip: content-box; }
  .col-scroll::-webkit-scrollbar-track { background: transparent; }
  textarea::placeholder, input::placeholder { color: var(--fg-subdued); }
  @keyframes winPop { from { transform: scale(.97); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes aaSpin { to { transform: rotate(360deg); } }
  @keyframes trayUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="app/glyphs.jsx"></script>
<script type="text/babel" src="app/data.jsx"></script>
<script type="text/babel" src="app/post.jsx"></script>
<script type="text/babel" src="app/addaccount.jsx"></script>
<script type="text/babel" src="app/tweaks-panel.jsx"></script>
<script type="text/babel" src="app/perchicon.jsx"></script>
<script type="text/babel" src="app/welcome.jsx"></script>
</body>
</html>
