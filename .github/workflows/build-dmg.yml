name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version written into the app and DMG filename
        required: false
        default: 0.0.0-dev
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ inputs.version }}"
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: swift test

      - name: Build universal app and DMG
        env:
          PERCH_VERSION: ${{ steps.version.outputs.value }}
        run: ./scripts/package-dmg.sh dist

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perch-${{ steps.version.outputs.value }}-macOS
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.dmg --generate-notes --title "$GITHUB_REF_NAME"
          fi
